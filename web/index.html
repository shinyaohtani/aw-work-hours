<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Hours</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="app.css">
</head>
<body class="m-0 bg-gradient-to-b from-gray-50 to-gray-100 text-gray-900 min-h-screen">

<div class="max-w-6xl mx-auto px-6 py-10">

  <!-- Eyebrow + title -->
  <div class="flex items-center gap-2 mb-6 px-1">
    <span class="text-lg">⏱️</span>
    <div class="min-w-0">
      <div class="text-[11px] font-semibold tracking-wide text-amber-600 uppercase">
        Work Hours
      </div>
      <h2 class="text-xl font-semibold tracking-tight text-gray-900 -mt-0.5">勤務時間</h2>
    </div>
  </div>

  <!-- Card -->
  <div class="rounded-2xl shadow-xl ring-1 ring-black/5 bg-white">

    <!-- Controls -->
    <div class="flex items-center gap-2 flex-wrap px-5 py-4 rounded-t-2xl
                bg-gradient-to-br from-amber-50 to-white border-b border-gray-100">
      <button id="prev"
        class="px-3.5 py-1.5 text-sm rounded-full border border-gray-200 bg-white text-gray-700
               hover:bg-gray-50 hover:border-gray-300 active:bg-gray-100 cursor-pointer
               transition-colors">
        &#8249; 前月
      </button>
      <input type="month" id="month"
        class="px-2.5 py-1.5 w-[120px] text-sm font-sans border border-gray-200 rounded-lg
               bg-white text-gray-700 outline-none focus:border-amber-400 focus:ring-2
               focus:ring-amber-100">
      <button id="next"
        class="px-3.5 py-1.5 text-sm rounded-full border border-gray-200 bg-white text-gray-700
               hover:bg-gray-50 hover:border-gray-300 active:bg-gray-100 cursor-pointer
               transition-colors">
        次月 &#8250;
      </button>
      <label class="flex items-center gap-1.5 text-sm text-gray-600 select-none ml-2 cursor-pointer">
        <input type="checkbox" id="noColon"> コロンなし
      </label>
      <button id="settings-btn"
        class="w-8 h-8 flex items-center justify-center rounded-full text-lg text-gray-400
               hover:text-gray-700 hover:bg-black/5 bg-transparent border-none cursor-pointer
               ml-1 transition-colors">
        &#9881;
      </button>
      <span id="status" class="ml-auto text-sm text-gray-400 whitespace-nowrap"></span>
    </div>

    <!-- Data table -->
    <div class="px-2 py-2">
      <table id="table" class="w-full"></table>
    </div>
  </div>
</div>

<!-- Settings dialog -->
<div id="settings-overlay"
  class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[200]">
  <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[340px] z-[201]">
    <div class="rounded-2xl overflow-hidden shadow-2xl ring-1 ring-black/5 bg-white">
      <div class="px-6 pt-4 pb-3 bg-gradient-to-br from-amber-50 to-white">
        <div class="flex items-center gap-1.5 text-[11px] font-semibold tracking-wide
                    text-amber-600 uppercase">
          <span>&#9881;</span><span>Settings</span>
        </div>
        <div class="text-sm font-semibold text-gray-900 mt-0.5">表示設定</div>
      </div>

      <div class="px-6 py-4 space-y-4">
        <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
          <input type="checkbox" id="s-no-colon"> コロンなし表示
        </label>

        <div>
          <span class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1.5">
            最小イベント秒数
          </span>
          <input type="number" id="s-min-event" min="0" step="1"
            class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white
                   text-gray-700 outline-none focus:border-amber-400 focus:ring-2
                   focus:ring-amber-100">
        </div>

        <div>
          <span class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1.5">
            AFKバケット
          </span>
          <select id="s-bucket"
            class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white
                   text-gray-700 outline-none focus:border-amber-400 focus:ring-2
                   focus:ring-amber-100">
            <option value="">自動選択</option>
          </select>
        </div>
      </div>

      <div class="flex justify-end gap-2 px-6 py-3 bg-gray-50 border-t border-gray-100">
        <button id="s-cancel"
          class="px-4 py-1.5 text-sm font-medium border border-gray-300 rounded-lg bg-white
                 text-gray-700 hover:bg-gray-100 cursor-pointer transition-colors">
          キャンセル
        </button>
        <button id="s-save"
          class="px-4 py-1.5 text-sm font-medium rounded-lg bg-gray-900 text-white
                 hover:bg-gray-700 cursor-pointer transition-colors border-none">
          保存
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Break overlay -->
<div id="break-overlay"
  class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[200]">
  <div id="break-panel" class="fixed break-panel w-[300px] z-[201]">
    <div class="rounded-2xl overflow-hidden shadow-2xl ring-1 ring-black/5 bg-white">
      <div class="flex items-start justify-between gap-3 px-5 pt-4 pb-3
                  bg-gradient-to-br from-amber-50 to-white">
        <div class="min-w-0">
          <div class="flex items-center gap-1.5 text-[11px] font-semibold tracking-wide
                      text-amber-600 uppercase">
            <span>☕</span><span>Break</span>
          </div>
          <div id="break-date" class="text-sm font-semibold text-gray-900 mt-0.5 truncate"></div>
          <div id="break-work-span" class="text-xs text-gray-400 mt-0.5 font-mono"></div>
        </div>
        <button id="break-close"
          class="shrink-0 w-6 h-6 flex items-center justify-center rounded-full text-lg
                 leading-none text-gray-400 hover:text-gray-700 hover:bg-black/5 bg-transparent
                 border-none cursor-pointer transition-colors">
          &times;
        </button>
      </div>
      <div id="break-list" class="px-3.5 py-3 space-y-1.5 max-h-[280px] overflow-y-auto"></div>
      <div class="flex justify-end px-3.5 py-3 bg-gray-50 border-t border-gray-100">
        <button id="break-done"
          class="px-4 py-1.5 text-sm font-medium rounded-lg bg-gray-900 text-white
                 hover:bg-gray-700 cursor-pointer transition-colors border-none">
          閉じる
        </button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
